name: EMBook Auto Reply

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Generate AI Response
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;

            const isIssueOpened =
              context.eventName === 'issues' && context.payload.action === 'opened';
            const isIssueEdited =
              context.eventName === 'issues' && context.payload.action === 'edited';
            const isComment =
              context.eventName === 'issue_comment' && context.payload.action === 'created';

            // Skip bot comments
            if (isComment && comment?.user?.type === 'Bot') {
              core.info('Skipping bot comment');
              return;
            }

            if (!process.env.OPENAI_API_KEY) {
              core.setFailed('Missing OPENAI_API_KEY secret');
              return;
            }

            let userMessage = '';

            if (isIssueOpened) {
              userMessage = `New issue opened

            Title: ${issue.title}
            Author: @${issue.user.login}
            Labels: ${issue.labels.map(l => l.name).join(', ') || 'none'}

            Body:
            ${issue.body || 'No description provided'}

            Write a helpful first response. Ask for more details if needed. Be friendly and professional.`;
            } else if (isIssueEdited) {
              userMessage = `Issue edited

            Title: ${issue.title}
            Author: @${issue.user.login}
            Labels: ${issue.labels.map(l => l.name).join(', ') || 'none'}

            Updated body:
            ${issue.body || 'No description provided'}

            Write a helpful follow-up response that acknowledges the updated details. Ask for any missing information if needed. Be friendly and professional.`;
            } else if (isComment) {
              userMessage = `Follow-up comment on issue

            Issue title: ${issue.title}
            Comment author: @${comment.user.login}

            Comment:
            ${comment.body}

            Original issue:
            ${issue.body || 'No description provided'}

            Write a helpful response to this comment. Be friendly and professional.`;
            } else {
              core.info('No supported event to process');
              return;
            }

            const developerInstructions = `You are EMBookBot, the friendly AI assistant for EMBook - the secure, AI-native coordination network for emergency management.

            Your role:
            - Help users with issues and questions about the EMBook repository
            - Ask clarifying questions when issue details are unclear
            - Provide helpful debugging steps for bug reports
            - Be friendly, professional, and concise
            - Use markdown formatting for readability
            - If it is a bug report, ask for: steps to reproduce, expected vs actual behavior, error messages, and environment details
            - If it is a feature request, acknowledge it positively and ask for use cases
            - If it is a question, try to help or direct them to relevant documentation

            Repository context:
            - embook-api: Node.js/Express.js REST API backend with PostgreSQL
            - Security: HMAC-SHA256, RS256 JWT, E2E encryption
            - Purpose: A proof of concept for emergency management coordination

            Keep responses concise but helpful. Max 2-3 paragraphs.`;

            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: 'gpt-5.4-mini',
                reasoning: {
                  effort: 'none'
                },
                text: {
                  verbosity: 'low'
                },
                max_output_tokens: 700,
                input: [
                  {
                    role: 'developer',
                    content: developerInstructions
                  },
                  {
                    role: 'user',
                    content: userMessage
                  }
                ]
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`OpenAI API error ${response.status}: ${errorText}`);
              return;
            }

            const data = await response.json();

            const reply =
              data.output_text?.trim() ||
              data.output
                ?.filter(item => item.type === 'message')
                ?.flatMap(item => item.content || [])
                ?.filter(part => part.type === 'output_text')
                ?.map(part => part.text)
                ?.join('\n')
                ?.trim();

            if (!reply) {
              core.setFailed('OpenAI returned no reply text');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                reply +
                '\n\n---\n🤖 *EMBookBot - Automated Response* | [Learn more](https://github.com/MrRyanAlexander/api)'
            });

            core.info('Reply posted successfully');

      - name: Add Labels for New Issues
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const content = `${title} ${body}`;

            const labels = [];

            if (
              content.includes('bug') ||
              content.includes('error') ||
              content.includes('failed') ||
              content.includes('crash') ||
              content.includes('not working')
            ) {
              labels.push('bug');
            }

            if (
              content.includes('feature') ||
              content.includes('request') ||
              content.includes('add') ||
              content.includes('implement')
            ) {
              labels.push('enhancement');
            }

            if (
              content.includes('question') ||
              content.includes('how to') ||
              content.includes('help')
            ) {
              labels.push('question');
            }

            if (content.includes('api')) {
              labels.push('api');
            }

            if (
              content.includes('ui') ||
              content.includes('frontend') ||
              content.includes('design')
            ) {
              labels.push('frontend');
            }

            if (
              content.includes('docs') ||
              content.includes('documentation')
            ) {
              labels.push('documentation');
            }

            labels.push('needs-triage');

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels
              });
              core.info(`Labels added: ${labels.join(', ')}`);
            } catch (error) {
              core.info(`Could not add labels. They may not exist yet. ${error.message}`);
            }
